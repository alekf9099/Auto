<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background — light lavender -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Gradient ring border -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.5"/>
  <!-- ☯ symbol -->
  <text x="256" y="348"
    text-anchor="middle"
    font-size="290"
    font-family="serif"
    fill="url(#ring)"
    opacity="0.9">☯</text>
  <!-- "봄" Korean label at bottom -->
  <text x="256" y="460"
    text-anchor="middle"
    font-size="68"
    font-family="serif"
    font-weight="700"
    fill="#7C3AED"
    opacity="0.6">봄</text>
</svg>
